services:
  postgres:
    image: postgres:16-alpine
    container_name: currency-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-currency_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-currency_password}
      POSTGRES_DB: ${DB_NAME:-currency_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-currency_user} -d ${DB_NAME:-currency_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - currency-network

  currency:
    build:
      context: .
      dockerfile: currency/Dockerfile
    container_name: currency-service
    environment:
      - CURRENCY_PORT=8081
      - CURRENCY_HOST=0.0.0.0
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-currency_user}
      - DB_PASSWORD=${DB_PASSWORD:-currency_password}
      - DB_NAME=${DB_NAME:-currency_db}
      - DB_SSLMODE=disable
      - WORKER_API_URL=https://latest.currency-api.pages.dev/v1/currencies/rub.json
      - WORKER_TARGET_CURRENCY=${WORKER_TARGET_CURRENCY:-usd}
      - LOG_LEVEL=info
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "-",
          "http://localhost:8081/internal/v1/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - currency-network
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: gateway-service
    environment:
      - GATEWAY_PORT=8080
      - GATEWAY_HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-key-32}
      - JWT_EXPIRATION=24h
      - CURRENCY_SERVICE_URL=http://currency:8081
      - LOG_LEVEL=info
    ports:
      - "8080:8080"
    depends_on:
      currency:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - currency-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  currency-network:
    driver: bridge
